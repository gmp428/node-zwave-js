version: "3.8"

# FreeTAKServer stack for Synology DS920+ via Portainer
# Before deploying:
#   1. Create /volume1/docker/freetakserver/data in File Station
#   2. Replace YOUR_SYNOLOGY_IP below with your Synology's LAN IP (e.g. 192.168.1.100)

services:
  freetakserver:
    image: ghcr.io/freetakteam/freetakserver:latest
    container_name: freetakserver
    restart: unless-stopped
    environment:
      - FTS_IP=YOUR_SYNOLOGY_IP
    volumes:
      - /volume1/docker/freetakserver/data:/data
    ports:
      - "8087:8087/tcp"    # CoT (unencrypted) — primary ATAK client connection port
      - "8089:8089/tcp"    # CoT SSL (encrypted)
      - "19023:19023/tcp"  # REST API

  freetakserver-ui:
    image: ghcr.io/freetakteam/ui:latest
    container_name: freetakserver-ui
    restart: unless-stopped
    environment:
      - FTS_IP=YOUR_SYNOLOGY_IP
    volumes:
      - /volume1/docker/freetakserver/data:/data
    ports:
      - "8090:8080/tcp"    # Web management UI (remapped from 8080 — already in use)
    depends_on:
      - freetakserver
