version: "3.8"

# FreeTAKServer stack for Synology DS920+ via Portainer
#
# BEFORE DEPLOYING: build the patched UI image first.
# See SETUP.md Step 3 for instructions.

services:
  freetakserver:
    image: ghcr.io/freetakteam/freetakserver:latest
    container_name: freetakserver
    restart: unless-stopped
    environment:
      - FTS_IP=192.168.68.50
    volumes:
      - /volume1/docker/freetakserver/data:/opt/fts
    ports:
      - "8087:8087/tcp"    # CoT (unencrypted) — primary ATAK client connection port
      - "8089:8089/tcp"    # CoT SSL (encrypted)
      - "19023:19023/tcp"  # REST API

  freetakserver-ui:
    image: freetakserver-ui:patched   # built from tak/Dockerfile.ui
    container_name: freetakserver-ui
    restart: unless-stopped
    environment:
      - FTS_IP=freetakserver   # internal Docker service name
      - FTS_API_PORT=8080
      - FTS_API_PROTO=http
      - FTS_UI_PORT=5000
      - FTS_API_KEY=token
    volumes:
      - fts_ui_data:/opt   # UI writes its database to /opt/FTSServer-UI.db
    ports:
      - "8091:5000/tcp"    # Web management UI
    depends_on:
      - freetakserver

volumes:
  fts_ui_data:
