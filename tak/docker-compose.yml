version: "3.8"

# FreeTAKServer stack for Synology DS920+ via Portainer

services:
  freetakserver:
    image: ghcr.io/freetakteam/freetakserver:latest
    container_name: freetakserver
    restart: unless-stopped
    environment:
      - FTS_IP=192.168.68.50
    volumes:
      - /volume1/docker/freetakserver/data:/data
    ports:
      - "8087:8087/tcp"    # CoT (unencrypted) — primary ATAK client connection port
      - "8089:8089/tcp"    # CoT SSL (encrypted)
      - "19023:19023/tcp"  # REST API

  freetakserver-ui:
    image: ghcr.io/freetakteam/ui:latest
    container_name: freetakserver-ui
    restart: unless-stopped
    environment:
      - APPIP=0.0.0.0          # bind to all interfaces so Docker can forward traffic
      - FTS_IP=freetakserver   # internal Docker service name — not the host IP
      - FTS_API_PORT=19023
      - FTS_API_PROTO=http
      - FTS_UI_PORT=5000
    ports:
      - "8091:5000/tcp"    # Web management UI
    depends_on:
      - freetakserver
